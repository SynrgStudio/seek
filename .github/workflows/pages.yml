# Publishes the site (site/ -> https://seek.synrgs.tech). Its tables and charts are generated from the benchmark's
# results in bench/results.json, so the site always shows the numbers that were measured.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, bench/results.json, src/version.h, assets/**, install.ps1, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
