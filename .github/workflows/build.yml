# Builds seek.exe on GitHub's own machines and runs the tests on every push, on a PC that isn't the maintainer's.
# Releases aren't made here: they are built, tested and published from the maintainer's PC (see README), and the
# build of each push is kept as an artifact of its run.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content src/version.h -Raw
          $version = [regex]::Match($text, 'SEEK_VERSION "(\d+)\.(\d+)\.(\d+)"')
          if (!$version.Success) { throw 'No version in src/version.h' }
          $v = $version.Groups
          if (!$text.Contains("SEEK_VERSION_NUM $($v[1]), $($v[2]), $($v[3]), 0")) { throw 'The versions in src/version.h do not match' }
          "version=$($v[1]).$($v[2]).$($v[3])" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        shell: cmd
        run: python -I tests\test.py

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: seek
          path: build/seek.exe
          if-no-files-found: error
